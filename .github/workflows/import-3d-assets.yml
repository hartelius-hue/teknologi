name: Import SkoleGPT 3D-bannere
on:
  push:
    paths:
      - skolegpt-3d-assets.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installér de 24 3D-billeder sikkert
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path("skolegpt-3d-assets.zip")
          if not archive.exists():
              print("Ingen billedpakke fundet. Import springes over.")
              raise SystemExit(0)
          files = [f"assets/3d/level-{i}.webp" for i in range(1,5)]
          files += [f"assets/3d/mission-{i:02d}.webp" for i in range(1,21)]
          with zipfile.ZipFile(archive) as z:
              for name in files:
                  try:
                      data = z.read(name)
                  except KeyError:
                      raise SystemExit(f"Mangler påkrævet billede: {name}")
                  if not (data[:4] == b"RIFF" and data[8:12] == b"WEBP"):
                      raise SystemExit(f"Ikke et gyldigt WebP-billede: {name}")
                  path = Path(name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
          print("Installeret", len(files), "3D-billeder")
          PY
      - name: Gem billedfiler og fjern importpakken
        shell: bash
        run: |
          if [ ! -f skolegpt-3d-assets.zip ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d/
          git rm -f skolegpt-3d-assets.zip
          if ! git diff --cached --quiet; then
            git commit -m "Installér 24 forskellige SkoleGPT 3D-bannere"
            git push
          fi
